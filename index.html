function drawFrom(deck, count) {
  const pool = [...deck];
  const out = [];
  for (let i = 0; i < count; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}

  const voidLight = `Imagine yourself inside a black void. But it isn't empty — it's warm. Comforting. Completely safe. You are held here, fully, by love itself.

Feel its warmth now — not just on your skin, but inside you. Inside every cell of your body. Healing, as it moves through you.

  const anchor = `From this moment forward — anytime you say the number eight, eight, eight, or hear it spoken by someone else, this exact feeling becomes immediately available to you again.`;

  const closingPre = `Now, let's count back to eight together. With each number, you'll rise gently back into this moment — still holding everything you just became.`;

  const closingCount = `One... two... three... four... five... six... seven... eight.`;
  const closingCountSSML = `One.<break time="0.8s" /> Two.<break time="0.8s" /> Three.<break time="0.8s" /> Four.<break time="0.8s" /> Five.<break time="0.8s" /> Six.<break time="0.8s" /> Seven.<break time="0.8s" /> Eight.`;

  const isStandaloneForReminder = window.matchMedia("(display-mode: standalone)").matches;

  return { fullMeditation, parts };
}

  async function startTone() {
    if (!audioCtxRef.current) {
      audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    const ctx = audioCtxRef.current;

    if (ctx.state === "suspended") {
      try {
        await ctx.resume();
      } catch (e) {
        // Still locked — browser requires a real tap. We check ctx.state below either way.
      }
    }

    // If Play is tapped again before a pending stop actually finished (within
    // the 650ms fade-out window), cancel that stop and ramp back up in place
    // instead of leaving the old node orphaned and creating a second one.
    if (toneStopTimeoutRef.current) {
      clearTimeout(toneStopTimeoutRef.current);
      toneStopTimeoutRef.current = null;
    }

    // A tone graph may already exist — either from an earlier blocked
    // autoplay attempt, or because we just cancelled a pending stop above.
    // Don't create a second one — just make sure it's actually audible.
    if (oscRef.current) {
      const gain = gainRef.current;
      const targetVal = CUSTOM_TONE_URL ? toneVolume : toneVolume * 0.06;
      gain.gain.cancelScheduledValues(ctx.currentTime);
      gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(targetVal, ctx.currentTime + 0.3);
      setTonePlaying(ctx.state === "running");
      return;
    }

    if (CUSTOM_TONE_URL) {
      try {
        const response = await fetch(CUSTOM_TONE_URL);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.loop = true;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(toneVolume, ctx.currentTime + 2.5);
        source.connect(gain);
        gain.connect(ctx.destination);
        source.start();
        oscRef.current = source;
        gainRef.current = gain;
        setTonePlaying(ctx.state === "running");
      } catch (e) {
        setVoiceError("Healing tone failed to load.");
      }
      return;
    }

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 432;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(toneVolume * 0.06, ctx.currentTime + 2.5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    oscRef.current = osc;
    gainRef.current = gain;
    setTonePlaying(ctx.state === "running");
  }

  function handleVolumeChange(newVal) {
    setToneVolume(newVal);
    if (gainRef.current && audioCtxRef.current) {
      const targetVal = CUSTOM_TONE_URL ? newVal : newVal * 0.06;
      gainRef.current.gain.setValueAtTime(targetVal, audioCtxRef.current.currentTime);
    }
  }

  function stopTone() {
    if (oscRef.current) {
      const ctx = audioCtxRef.current;
      const gain = gainRef.current;
      const src = oscRef.current;
      gain.gain.cancelScheduledValues(ctx.currentTime);
      gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
      toneStopTimeoutRef.current = setTimeout(() => {
        try {
          src.stop();
          src.disconnect();
        } catch (e) {
          // Already stopped/disconnected — fine, nothing left to clean up.
        }
        // Only clear the ref if it's still pointing at THIS source — if
        // Play was tapped again in the meantime, startTone() already
        // reused it and we shouldn't null out a currently-active node.
        if (oscRef.current === src) {
          oscRef.current = null;
        }
        toneStopTimeoutRef.current = null;
      }, 650);
    }
    setTonePlaying(false);
  }

  function wait(ms) {

  // --- Audio cache (IndexedDB) so replaying the same saved meditation ---
  // --- never calls ElevenLabs / costs money again after the first time. ---
  const AUDIO_DB_NAME = 'magi_audio_cache';
  const AUDIO_STORE = 'clips';
  let audioDbPromise = null;

  function openAudioDb() {
    if (audioDbPromise) return audioDbPromise;
    audioDbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(AUDIO_DB_NAME, 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore(AUDIO_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return audioDbPromise;
  }

  async function hashText(text) {
    const enc = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function getCachedClip(key) {
    try {
      const db = await openAudioDb();
      return await new Promise((resolve) => {
        const tx = db.transaction(AUDIO_STORE, 'readonly');
        const req = tx.objectStore(AUDIO_STORE).get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    } catch (e) {
      return null; // caching is a nice-to-have; never block playback on it
    }
  }

  async function setCachedClip(key, blob) {
    try {
      const db = await openAudioDb();
      await new Promise((resolve) => {
        const tx = db.transaction(AUDIO_STORE, 'readwrite');
        tx.objectStore(AUDIO_STORE).put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    } catch (e) {
      // fail silently — same reasoning as above
    }
  }

  async function fetchClipUrl(text) {
    const cacheKey = await hashText(text);
    const cached = await getCachedClip(cacheKey);
    if (cached) {
      console.log(`%c[cache HIT]%c no ElevenLabs call — served from IndexedDB (key ${cacheKey.slice(0, 8)}…)`, "color:#0D9488;font-weight:bold", "color:inherit");
      return cached;
    }

    console.log(`%c[cache MISS]%c calling ElevenLabs now (key ${cacheKey.slice(0, 8)}…) — will be cached for next time`, "color:#DC2645;font-weight:bold", "color:inherit");
    const response = await fetch(`${WORKER_URL}/tts`, {
      method: "POST",
      body: JSON.stringify({ text, voiceId: ELEVENLABS_VOICE_ID, speed: 0.85 }),
    });
    if (!response.ok) {
      const errText = await response.text();
      console.error("TTS request failed:", response.status, errText);
      throw new Error(`Voice failed to load (status ${response.status}). Check the ElevenLabs key in your Worker.`);
    }
    const blob = await response.blob();
    setCachedClip(cacheKey, blob); // fire-and-forget, don't block playback on the write
    return blob;
  }

  // Plays a fetched voice clip through the SAME AudioContext already used
  // for the healing tone. This is the actual fix for iOS blocking playback
  // partway through a meditation: a plain <audio> element re-checks the
  // autoplay policy on every single .play() call, and iOS Safari — especially
  // in installed/standalone mode — blocks any of those calls that aren't
  // directly inside a fresh tap. An AudioContext only needs to be unlocked
  // ONCE by a real gesture; every subsequent buffer played through it,
  // however later triggered, keeps working — exactly like the tone already does.
  async function playClipUrl(blob) {
    const startedAt = Date.now();
    if (!audioCtxRef.current) {
      audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    const ctx = audioCtxRef.current;
    if (ctx.state === "suspended") {
      try {
        await ctx.resume();
      } catch (e) {
        // Still locked — same fallback as the tone: caller can retry after a real tap.
      }
    }

    if (!voiceGainRef.current) {
      voiceGainRef.current = ctx.createGain();
      voiceGainRef.current.gain.value = 1;
      voiceGainRef.current.connect(ctx.destination);
    }

    const arrayBuffer = await blob.arrayBuffer();
    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
    const source = ctx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(voiceGainRef.current);
    speechAudioRef.current = source;

    setVoiceLoading(false);
    await new Promise((resolve, reject) => {
      source.onended = resolve;
      try {
        source.start();
      } catch (err) {
        reject(new Error("Playback was blocked by the browser. Tap the button again to continue."));
      }
    });
    return Date.now() - startedAt;
  }

  async function speakMeditation() {
    setVoiceError(null);
    setSpeaking(true);
    setVoiceLoading(true);
    stopFlagRef.current = false;

    const parts = meditationParts;
    const beats = parts
      ? [
          { type: "speak", text: parts.inductionPre },
          { type: "pause", ms: 1500 },
          { type: "speak", text: parts.breathCycleSSML },
          { type: "pause", ms: 1500 },
          { type: "speak", text: parts.inductionCountSetup },
          { type: "pause", ms: 1200 },
          { type: "speak", text: parts.countSSML },
          { type: "pause", ms: 1200 },
          { type: "speak", text: parts.inductionPost },
          { type: "pause", ms: 2500 },
          { type: "speak", text: parts.voidLight },
          { type: "pause", ms: 3500 },
          { type: "speak", text: parts.visualization },
          { type: "pause", ms: 1800 },
          { type: "speak", text: parts.anchor },
          { type: "pause", ms: 2000 },
          { type: "speak", text: parts.closingPre },
          { type: "pause", ms: 1200 },
          { type: "speak", text: parts.closingCountSSML },
          { type: "pause", ms: 1000 },
          { type: "speak", text: parts.closingPost },
          { type: "pause", ms: 2000 },
          { type: "speak", text: parts.reminder },
        ]
      : meditation.split(/\n\n+/).filter((s) => s.trim()).map((text) => ({ type: "speak", text }));

    function nextSpeakIndex(fromIdx) {
      for (let i = fromIdx; i < beats.length; i++) {
        if (beats[i].type === "speak") return i;
      }
      return -1;
    }

    const fetchCache = {};
    function ensureFetching(idx) {
      if (idx === -1 || fetchCache[idx]) return;
      fetchCache[idx] = fetchClipUrl(beats[idx].text);
    }

    try {
      const firstIdx = nextSpeakIndex(0);
      if (firstClipPrefetchRef.current && beats[firstIdx] && beats[firstIdx].text === parts?.inductionPre) {
        fetchCache[firstIdx] = firstClipPrefetchRef.current;
        firstClipPrefetchRef.current = null;
      }
      ensureFetching(firstIdx);

      for (let idx = 0; idx < beats.length; idx++) {
        if (stopFlagRef.current) break;
        const beat = beats[idx];

        if (beat.type === "pause") {
          ensureFetching(nextSpeakIndex(idx + 1));
          await wait(beat.ms);
          continue;
        }

        ensureFetching(idx);
        let url = await fetchCache[idx];
        if (!url) {
          url = await fetchClipUrl(beat.text);
        }
        ensureFetching(nextSpeakIndex(idx + 1));

        await playClipUrl(url);
      }
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches;
      if (!isStandalone) {
        setShowHomeScreenPopup(true);
      }
      setStage("instant-reads");
    } catch (e) {
      setVoiceError(e.message || "Voice failed to play. Check your connection and try again.");
    } finally {
      setSpeaking(false);
      setVoiceLoading(false);
    }
  }

  function stopSpeaking() {
    stopFlagRef.current = true;
    if (speechTimeoutRef.current) {
      clearTimeout(speechTimeoutRef.current);
      speechTimeoutRef.current = null;
    }
    if (speechWaitResolveRef.current) {
      speechWaitResolveRef.current();
      speechWaitResolveRef.current = null;
    }
    if (speechAudioRef.current) {
      try {
        speechAudioRef.current.stop();
      } catch (e) {
        // Already ended or never started — nothing left to stop.
      }
      speechAudioRef.current = null;
    }
    setSpeaking(false);
    setVoiceLoading(false);
  }

                  You're out of credits. Refill to keep going.
                </p>
                <a
                  href={`https://buy.stripe.com/fZueVdaPo3gQ3XtaBqdAk04?prefilled_email=${encodeURIComponent(emailInput)}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="glow-btn"
                  style={{ textDecoration: "none", display: "inline-block", background: "#b81426" }}
                >
                  Refill — 12💎 for $8.88
                </a>
              </div>
            ) : (
              <>
                <textarea
                  className="field"
                  rows={4}
                  placeholder="What's on your mind? Be as specific as you'd like..."
                  value={instantReadQuestion}
                  onChange={(e) => setInstantReadQuestion(e.target.value)}
                  style={{ marginBottom: "1rem" }}
                />
                <button
                  className="glow-btn"
                  onClick={() => requestInstantRead()}
                  disabled={instantReadLoading || !instantReadQuestion.trim()}
                  style={{ width: "100%", background: "#b81426" }}
                >
                  {instantReadLoading ? "Reading..." : "Get My Instant Read — 1💎"}
                </button>
                {instantReadError && instantReadError !== "out_of_reads" && (
                  <p style={{ color: "#DC2645", fontSize: "0.9rem", marginTop: "0.8rem" }}>{instantReadError}</p>
                )}
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<TarotDraw />);
</script>
</body>
</html>
