<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Rockstar Initiation — Application</title><meta name="theme-color" content="#0D9488"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,500;0,600;1,400&display=swap"><style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .unlock-btn {
          position: relative;
          flex: 1 1 160px;
          max-width: 220px;
          padding: 22px 16px;
          border-radius: 22px;
          border: none;
          background: var(--card-bg);
          box-shadow: var(--card-shadow);
          color: var(--text);

          font-family: inherit;

        }
        .unlock-btn:active { transform: scale(0.97); }
        .unlock-btn-bundle { box-shadow: var(--card-shadow), 0 0 0 2px rgba(13,148,136,0.5) inset; }
        .unlock-btn-badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #0D9488; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
        .unlock-btn-price { font-size: 26px; font-weight: 700; }
        .unlock-btn-label { font-size: 13px; color: var(--meta); margin-top: 4px; }
        .reading-row { text-align: left; background: var(--card-bg); box-shadow: var(--card-shadow); border: none; border-radius: 14px; padding: 14px 18px; color: var(--text); cursor: pointer; font-family: inherit; display: flex; flex-direction: column; gap: 4px; transition: transform 0.15s ease; }
        .reading-row:active { transform: scale(0.98); }
        .reading-row-goal { font-weight: 600; }

        /* ---------- The Draw — entry page (free-reading funnel) ----------
           Uses the site's own theme variables (same teal accent, same
           light/dark toggle as the rest of the app) — just a richer layout. */
        .eyebrow {
          font-family: 'Cinzel', serif; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.22em;
          color: var(--meta); margin: 0 0 22px; text-transform: uppercase;
        }
        .hero-h1 {
          font-size: 2.05rem; line-height: 1.28; text-transform: uppercase;
        }
        @media (min-width: 860px) { .hero-h1 { font-size: 2.6rem; } }
        .hero-sub { margin: 0 0 40px; }
        .input-label {
          display: block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.18em;
          text-transform: uppercase; color: var(--meta); margin-bottom: 12px; text-align: left;
        }
        .identity-input { font-size: 1.02rem; line-height: 1.55; }
        .identity-input::placeholder { font-style: italic; }
        .reassurance { font-size: 0.82rem; color: var(--meta); margin: 16px 0 0; }
        .landing-divider { display: flex; justify-content: center; padding: 10px 0 6px; color: var(--meta); opacity: 0.6; }
        .sacred-glyph { opacity: 0.85; }
        .section-h2 {
          font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.5rem; line-height: 1.35;
          color: var(--text); margin: 0 0 20px; text-transform: uppercase; letter-spacing: -0.005em;
        }
        .section-body { margin: 0 0 36px; }
        .steps-list { display: flex; flex-direction: column; gap: 24px; text-align: left; margin-bottom: 40px; width: 100%; }
        .step { display: flex; gap: 18px; align-items: flex-start; }
        .step-num { font-family: 'Cinzel', serif; font-size: 0.85rem; font-weight: 600; color: var(--meta); letter-spacing: 0.05em; padding-top: 2px; flex-shrink: 0; }
        .step-title { font-weight: 600; font-size: 0.98rem; color: var(--text); margin-bottom: 4px; }
        .step-desc { font-size: 0.9rem; line-height: 1.55; color: var(--text-sub); margin: 0; }
        .final-panel .sub { margin-bottom: 32px; }

        /* ---------- Your Reading — reading-results page ----------

           light/dark toggle and of the entry page's theme-linked colors:
           this is the one moment meant to feel like a private reveal. */
        .reading-result {
          width: 100vw;
          margin-left: calc(50% - 50vw);
          margin-right: calc(50% - 50vw);
          background:
            radial-gradient(ellipse 900px 460px at 50% -6%, rgba(168,85,247,0.10), transparent 60%),
            radial-gradient(ellipse 620px 440px at 90% 18%, rgba(212,168,74,0.07), transparent 62%),
            radial-gradient(ellipse 620px 500px at 4% 82%, rgba(147,51,234,0.07), transparent 60%),
            #0a0908;
          color: #efe7d8;
          padding-bottom: 4vh;
        }
        .reading-result .content-inner { max-width: 460px; margin: 0 auto; padding: 6vh 24px 6vh; text-align: center; }
        @media (min-width: 860px) { .reading-result .content-inner { max-width: 600px; padding: 8vh 24px 7vh; } }
        .reading-result .eyebrow { color: #cfa646; }

        .reading-result .input-label { color: #cfa646; }
        .reading-result .rr-identity {
          font-family: 'Cinzel', serif; font-style: italic; font-size: 1.15rem; line-height: 1.6;
          color: #f6efe1; margin: 0; padding: 0 6px;
        }
        .reading-result .landing-divider { background: transparent; color: rgba(212,168,74,0.45); padding: 4px 0; }

        .reading-result .rr-cards { display: flex; flex-direction: column; gap: 32px; }
        .reading-result .rr-card {
          animation: rrCardIn 0.6s ease both;
        }
        @keyframes rrCardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .reading-result .rr-card-role {
          font-family: 'Cinzel', serif; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.16em;
          color: #cfa646; margin-bottom: 10px;
        }
        .reading-result .rr-card-question { font-size: 0.92rem; font-style: italic; color: #a89e8c; margin: 0 0 16px; }
        .reading-result .rr-card-face {
          position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 14px; padding: 24px 20px; border: 1px solid rgba(212,168,74,0.35); border-radius: 8px;
          background: linear-gradient(180deg, rgba(212,168,74,0.05), rgba(255,255,255,0.015));
          box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 14px 34px rgba(0,0,0,0.4);
          margin-bottom: 14px;
        }
        .reading-result .rr-card-art {

          border: 1px solid rgba(212,168,74,0.4); box-shadow: 0 10px 26px rgba(0,0,0,0.45);
        }
        .reading-result .rr-card-face-corner {
          position: absolute; top: 10px; left: 14px; font-family: 'Cinzel', serif; font-size: 0.75rem;
          color: rgba(212,168,74,0.6); letter-spacing: 0.05em;
        }
        .reading-result .rr-card-face .sacred-glyph { color: #cfa646; opacity: 0.55; }
        .reading-result .rr-card-face-name {
          font-family: 'Cinzel', serif; font-size: 1.15rem; font-weight: 600; color: #f6efe1; text-align: center;
        }
        .reading-result .rr-card-interp { font-size: 0.92rem; line-height: 1.6; color: #b9ae9a; margin: 0; }
        .reading-result .source-note { font-size: 0.72rem; line-height: 1.5; color: #6b6255; text-align: center; margin-top: 24px; }

        .reading-result .section-h2 {
          font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.4rem; line-height: 1.35;
          color: #f6efe1; margin: 0 0 20px; text-transform: uppercase; letter-spacing: -0.005em;
        }
        .reading-result .rr-h2-small { font-size: 1.15rem; }
        .reading-result .sub { color: #a89e8c; }

        }
        .reading-result .rr-block-label {
          font-size: 0.68rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #cfa646;
        }
        .reading-result .rr-block-name {
          font-family: 'Cinzel', serif; font-size: 1.7rem; font-weight: 600; color: #e6c876; text-transform: uppercase;
        }
        .reading-result .rr-synthesis-text { font-size: 1.05rem; line-height: 1.75; color: #ddd3c2; margin: 0; }

        .reading-result .rr-gap-flow { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 28px; }
        .reading-result .rr-gap-step {
          font-size: 0.78rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
          color: #b9ae9a; padding: 10px 18px; border: 1px solid rgba(255,255,255,0.1); border-radius: 999px;
        }
        .reading-result .rr-gap-block { color: #e6c876; border-color: rgba(212,168,74,0.4); }
        .reading-result .rr-gap-arrow { color: #6b6255; font-size: 0.9rem; }
        .reading-result .rr-gap-copy { margin: 0; }

        .reading-result .rr-cta { background: linear-gradient(135deg, #b6862f, #e3c069); color: #1a1408; font-weight: 700; box-shadow: 0 1px 2px rgba(212,168,74,0.2), 0 10px 26px rgba(212,168,74,0.18); }
        .reading-result .rr-cta:active:not(:disabled) { box-shadow: 0 1px 2px rgba(212,168,74,0.2), 0 4px 12px rgba(212,168,74,0.16); }
        .reading-result .rr-bundle-cta { background: rgba(255,255,255,0.06); color: #f6efe1; }
        .reading-result .reassurance { font-size: 0.82rem; color: #8f8879; margin: 16px 0 0; }
        .reading-result .rr-final .rr-identity { margin-bottom: 24px; }
        .reading-result .rr-final .rr-bundle-cta { margin-top: 12px; }
        .reading-result .text-link { color: #cfa646; opacity: 0.85; }

        .reading-result .rr-preview-section .sub { margin-bottom: 24px; }
        .reading-result .rr-preview-box {
          background: linear-gradient(180deg, rgba(212,168,74,0.05), rgba(255,255,255,0.015));
          border: 1px solid rgba(212,168,74,0.3);
          border-radius: 18px;
          padding: 32px 24px;
          margin-bottom: 22px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }
        .reading-result .rr-preview-play {
          display: flex; flex-direction: column; align-items: center; gap: 12px;
          background: none; border: none; cursor: pointer; color: #e6c876; font-family: inherit;

          width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(212,168,74,0.5);

          transition: transform 0.15s ease, background 0.15s ease;

        .reading-result .rr-preview-play:active:not(:disabled) .rr-preview-play-icon { transform: scale(0.94); }

        .reading-result .rr-preview-text { font-style: italic; font-size: 1rem; line-height: 1.65; color: #ddd3c2; margin: 0; }

        .reading-result .rr-reviews-section .testimonials { margin-bottom: 0; }
        .reading-result .testimonial-card {
          background: rgba(255,255,255,0.03); box-shadow: 0 14px 34px rgba(0,0,0,0.35);
          border: 1px solid rgba(212,168,74,0.15);
        }
        .reading-result .testimonial-quote { color: #ddd3c2; }
        .reading-result .testimonial-name { color: #a89e8c; }
        .reading-result .stars { color: #e3c069; }

        /* ---------- Your Reset — post-purchase meditation + Initiation upsell ----------
           Same private, dark/gold/magenta treatment as the rest of the funnel;
           gradually more expansive/philosophical from section 4 down (.pm-deeper). */
        .post-meditation {
          width: 100vw;
          margin-left: calc(50% - 50vw);
          margin-right: calc(50% - 50vw);
          background: #0a0908;
          color: #efe7d8;
        }
        .post-meditation .content-inner { max-width: 460px; margin: 0 auto; padding: 6vh 24px 6vh; text-align: center; }
        @media (min-width: 860px) { .post-meditation .content-inner { max-width: 600px; padding: 7vh 24px 7vh; } }
        .post-meditation .eyebrow { color: #cfa646; }
        .post-meditation .sub { color: #a89e8c; }
        .post-meditation .landing-divider { background: transparent; color: rgba(212,168,74,0.4); padding: 4px 0; }

        .post-meditation .pm-hero {
          background: radial-gradient(ellipse 900px 460px at 50% -10%, rgba(168,85,247,0.09), transparent 62%), #0a0908;
          padding-top: 8vh;
        }
        .post-meditation .pm-sub { margin-bottom: 40px; }
        .post-meditation .pm-player { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 30px; }
        .post-meditation .pm-player-btn {
          width: 96px; height: 96px; border-radius: 50%; border: 1px solid rgba(212,168,74,0.45);
          background: radial-gradient(circle, rgba(212,168,74,0.14), rgba(212,168,74,0.03));
          color: #e6c876; display: flex; align-items: center; justify-content: center; cursor: pointer;
          transition: transform 0.15s ease, box-shadow 0.2s ease; box-shadow: 0 0 0 0 rgba(212,168,74,0.25);
        }
        .post-meditation .pm-player-btn svg { width: 30px; height: 30px; }
        .post-meditation .pm-player-btn:active { transform: scale(0.96); }
        .post-meditation .pm-player-btn-active {
          animation: pmBreathe 2.4s ease-in-out infinite;
        }
        @keyframes pmBreathe {
          0%, 100% { box-shadow: 0 0 0 0 rgba(212,168,74,0.22); }
          50% { box-shadow: 0 0 0 14px rgba(212,168,74,0); }
        }
        .post-meditation .pm-pause-icon { position: relative; width: 22px; height: 26px; }
        .post-meditation .pm-pause-icon::before, .post-meditation .pm-pause-icon::after {
          content: ''; position: absolute; top: 0; width: 7px; height: 26px; background: currentColor; border-radius: 1px;
        }
        .post-meditation .pm-pause-icon::before { left: 2px; }
        .post-meditation .pm-pause-icon::after { right: 2px; }
        .post-meditation .pm-eq { display: flex; align-items: flex-end; gap: 4px; height: 20px; }
        .post-meditation .pm-eq-bar { width: 3px; height: 6px; border-radius: 2px; background: rgba(212,168,74,0.35); transition: background 0.2s ease; }
        .post-meditation .pm-eq-bar-active { background: #d4a84a; animation: pmEq 0.9s ease-in-out infinite; }
        @keyframes pmEq { 0%, 100% { height: 6px; } 50% { height: 20px; } }
        .post-meditation .pm-player-label { font-size: 0.78rem; letter-spacing: 0.05em; color: #cfa646; text-transform: uppercase; margin: 0; }
        .post-meditation .pm-instruction { font-size: 0.92rem; font-style: italic; color: #9a917f; margin: 0 0 14px; }
        .post-meditation .pm-personalized { font-size: 0.9rem; color: #b9ae9a; margin: 0; }
        .post-meditation .pm-no-meditation { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 30px; }

        .post-meditation .pm-note { font-size: 0.9rem; color: #cfa646; margin: 18px 0 0; font-style: italic; }

        .post-meditation .pm-recap { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
        .post-meditation .pm-recap-row { display: flex; flex-direction: column; gap: 6px; }
        .post-meditation .pm-recap-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #cfa646; }
        .post-meditation .pm-recap-value { font-family: 'Cinzel', serif; font-style: italic; font-size: 1.05rem; color: #f6efe1; }
        .post-meditation .pm-recap-block { font-style: normal; text-transform: uppercase; color: #e6c876; letter-spacing: 0.02em; }

        .post-meditation .pm-deeper {
          background:
            radial-gradient(ellipse 700px 500px at 90% 10%, rgba(147,51,234,0.08), transparent 60%),
            radial-gradient(ellipse 700px 560px at 8% 60%, rgba(168,85,247,0.08), transparent 60%),
            radial-gradient(ellipse 700px 500px at 85% 95%, rgba(212,168,74,0.06), transparent 60%),
            #0a0908;
        }
        .post-meditation .section-h2 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.4rem; line-height: 1.35; color: #f6efe1; margin: 0 0 20px; text-transform: uppercase; letter-spacing: -0.005em; }
        .post-meditation .rr-h2-small { font-size: 1.15rem; }
        .post-meditation .rr-h1 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 2rem; line-height: 1.25; color: #f6efe1; margin: 0 0 18px; text-transform: uppercase; }
        @media (min-width: 860px) { .post-meditation .rr-h1 { font-size: 2.4rem; } }

        .post-meditation .pm-flow { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 26px; }
        .post-meditation .pm-flow-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .post-meditation .pm-flow-step {
          font-family: 'Cinzel', serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
          color: #f6efe1; padding: 10px 20px; border: 1px solid rgba(212,168,74,0.35); border-radius: 999px;
        }
        .post-meditation .pm-flow-arrow { color: #6b6255; font-size: 0.85rem; padding: 2px 0; }

        .post-meditation .pm-initiation-sub { font-size: 0.95rem; color: #cfa646; letter-spacing: 0.04em; margin: 0 0 6px; }
        .post-meditation .pm-price { font-family: 'Cinzel', serif; font-size: 2.4rem; font-weight: 600; color: #e6c876; margin: 0 0 20px; }
        .post-meditation .pm-list-block { margin-top: 26px; text-align: left; }
        .post-meditation .pm-list-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #cfa646; margin-bottom: 12px; }
        .post-meditation .pm-tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .post-meditation .pm-tag { font-size: 0.78rem; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ddd3c2; }
        .post-meditation .pm-tag-gold { background: rgba(212,168,74,0.1); border-color: rgba(212,168,74,0.3); color: #e6c876; }

        .post-meditation .pm-toc { display: flex; flex-direction: column; gap: 14px; text-align: left; margin-top: 10px; }
        .post-meditation .pm-toc-row { display: flex; align-items: baseline; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .post-meditation .pm-toc-num { font-family: 'Cinzel', serif; font-size: 0.85rem; color: #cfa646; flex-shrink: 0; }

        .post-meditation .pm-continues { display: flex; flex-direction: column; align-items: center; }
        .post-meditation .pm-level { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px; }
        .post-meditation .pm-level-num { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: #cfa646; }
        .post-meditation .pm-level-name { font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 600; color: #f6efe1; text-transform: uppercase; }
        .post-meditation .pm-level-desc { font-size: 0.88rem; font-style: italic; color: #a89e8c; }
        .post-meditation .pm-level-muted { opacity: 0.65; }

        .post-meditation .rr-cta { background: linear-gradient(135deg, #b6862f, #e3c069); color: #1a1408; font-weight: 700; box-shadow: 0 1px 2px rgba(212,168,74,0.2), 0 10px 26px rgba(212,168,74,0.18); text-decoration: none; }
        .post-meditation .rr-cta:active { box-shadow: 0 1px 2px rgba(212,168,74,0.2), 0 4px 12px rgba(212,168,74,0.16); }

        .post-meditation .pm-footer, .reading-result .pm-footer { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 8vh; }
        .post-meditation .text-link { color: #cfa646; opacity: 0.85; }
      

        :root {
          --bg1: #faf8f5;
          --bg-gradient: radial-gradient(ellipse at top, #ffffff 0%, #ece2d0 60%);
          --text: #1c1a17; --text-sub: #75705f;
          --card-bg: #ffffff; --card-border: rgba(0,0,0,0.06);
          --card-shadow: 0 1px 2px rgba(20,15,5,0.03), 0 10px 28px rgba(20,15,5,0.05);
          --input-bg: #ffffff; --input-border: rgba(0,0,0,0.09);
          --cta-secondary-bg: rgba(0,0,0,0.045); --cta-secondary-text: #1c1a17;
          --link: #0b7a6f; --error: #c0453f; --meta: #938c7c;
          --pitch-bg: rgba(13,148,136,0.06); --pitch-border: rgba(13,148,136,0.16); --pitch-text: #1c1a17;
          --preview-label: #0b7a6f; --star: #c99a1f;
          --modal-bg: #ffffff; --modal-border: rgba(0,0,0,0.07);
          --card-chip-text: #8a6a24; --card-chip-bg: rgba(184,134,11,0.08);
          --overlay: rgba(30,24,15,0.35);
          --spinner-track: rgba(0,0,0,0.12);
        }
        [data-theme="dark"] {
          --bg1: #12100e;
          --bg-gradient: radial-gradient(ellipse at top, #14201e 0%, #0a0f0e 60%);
          --text: #f3f1ec; --text-sub: #a39c8c;
          --card-bg: rgba(255,255,255,0.045); --card-border: rgba(255,255,255,0.08);
          --card-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 10px 28px rgba(0,0,0,0.35);
          --input-bg: rgba(255,255,255,0.05); --input-border: rgba(255,255,255,0.12);
          --cta-secondary-bg: rgba(255,255,255,0.08); --cta-secondary-text: #fff;

  const prompt=`You are the symbolic five-card tarot reading engine for The Rockstar Initiation, a reflective application for established artists exploring their next creative persona.
  Interpret the RANDOMLY drawn cards as symbols, not a factual diagnosis or evidence of supernatural knowledge. You must not imply the cards were chosen by their answers.
  Artist name: ${v.displayName||''}; desired identity: ${v.desiredIdentity||''}; persona: ${v.personaName||''}; childhood inclinations: ${v.origin||''};
  distance from desired identity 1-10: ${v.distance||''}; main obstacle: ${v.obstacle||''}; creative energy: ${JSON.stringify(v.energy||[])};
  current reaction to inspiration: ${v.response||''}; what they will leave behind: ${v.cost||''}; next project: ${v.project||''}; personal reflection: ${v.adaptive||''}.
  Cards in positions SELF, MIRROR, SHADOW, BINDING, PATH: ${cards.map((c,i)=>CARD_POSITIONS[i]+': '+c.n+' ('+c.k+')').join(' | ')}.
  ${isCorrection?'Their previous reading: '+prior+'; their specific correction: '+(v.correction||'')+'. Incorporate that feedback and provide a new coherent interpretation of the same symbolic cards.':''}
  Write concise, distinct, specific interpretations linked to the artist's actual answers. Avoid invented biographical facts and guaranteed psychological outcomes.
  Respond ONLY with valid JSON: {"name":"a dominant Major Arcana from the drawn five cards", "title":"a short artistic archetype title", "text":"a concise summary around 80 words", "sections":{"self":"1-2 sentences","mirror":"1-2 sentences","shadow":"1-2 sentences","binding":"1-2 sentences","path":"1-2 sentences with one practical action"}}.`;
  try{
    const response=await fetch(CONFIG.aiRelay,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1400,messages:[{role:'user',content:prompt}]})});
    if(!response.ok)throw new Error('Reading service HTTP '+response.status);
    const parsed=parseModelJSON(await response.json());
    if(!parsed.sections?.self||!parsed.sections?.path)throw new Error('Reading response was incomplete');
    db.reading={name:String(parsed.name||cards[0].n),title:String(parsed.title||'The Artist'),text:String(parsed.text||''),cards,sections:parsed.sections,generatedAt:new Date().toISOString()};
    save();render();
  }catch(error){console.error(error);showError('The reading could not be generated. Please try again. '+error.message);}
  finally{pendingApi=false;}
}
async function playInitiationAudio(){
  const v=a(),reading=db.reading;
  if(!reading){showError('Generate your reading first.');return;}
  if(audioElement && !audioElement.paused){audioElement.pause();return;}
  if(audioElement && audioElement.src){audioElement.play().catch(e=>showError(e.message));return;}
  const text=`${v.displayName||'Artist'}, return to the identity you have chosen. ${v.desiredIdentity||''}. ${reading.sections?.path||reading.text||''} Notice what this identity invites you to practice today. Imagine one action you can take. Let your next artistic era begin with that action.`;
  try{
    const res=await fetch(CONFIG.aiRelay+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voiceId:CONFIG.voiceId,speed:0.85})});
    if(!res.ok)throw new Error('Voice service HTTP '+res.status);
    audioUrl=URL.createObjectURL(await res.blob());audioElement=new Audio(audioUrl);await audioElement.play();
  }catch(error){console.error(error);showError('Unable to play the guided preview: '+error.message)}
}
function qualifiesForCall(v){
  // Private calls: established artists earning $80k+ who are ready to act,
  // or artists earning $50k–$79,999 with exceptional commitment.
  const experience=v.established==='established';
  const readiness=Number(v.seriousness)||0;
  return experience && ((['80to100','over100'].includes(v.income) && readiness>=4) || (v.income==='50to80' && readiness===5));
}
async function submitArtistApplication(){
  const v={...a()};
  const route=qualifiesForCall(v)?'call':'self';
  v.route=route;
  const submission={profile:{name:v.displayName,email:v.email,persona:v.personaName,desiredIdentity:v.desiredIdentity},responses:v,reading:db.reading,submittedAt:new Date().toISOString()};
  localStorage.setItem(KEY+'-last-submission',JSON.stringify(submission));
  // Secure anonymous submission: no applicant sign-in or email verification.
  // The Edge Function writes with server-only credentials and never exposes them in HTML.
  if(!CONFIG.applicationEndpoint){showError('Application submission is temporarily unavailable. Please try again later.');return false;}
  try{
    const res=await fetch(CONFIG.applicationEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(submission)});
    if(!res.ok){const detail=await res.json().catch(()=>null);throw new Error(detail?.error||('Submission HTTP '+res.status));}
    return true;
  }catch(err){showError('We could not submit your application. Please retry. '+err.message);return false;}
}

const KEY='rockstar-draw-identical-v1';
const $=id=>document.getElementById(id);
const clean=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
db=db||{profile:{},applications:[],current:{},reading:null,priorReading:null};
let step='intro',feedbackCount=0;
const order=['intro','distance','resistance','energy','response','cost','adaptive','reading','accuracy','seriousness','income','experience','recommend'];
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const a=()=>db.current;
const btn=(label,fn,kind='')=>`<button type="button" class="cta-btn ${kind}" data-action="${fn}">${label}</button>`;
const field=(key,label,placeholder,kind='text',required=true)=>`<label class="input-label" for="f-${key}">${label}</label>${kind==='textarea'?`<textarea class="text-input identity-input" id="f-${key}" data-field="${key}" placeholder="${clean(placeholder)}" ${required?'required':''}>${clean(a()[key])}</textarea>`:`<input class="text-input" id="f-${key}" data-field="${key}" type="${kind}" placeholder="${clean(placeholder)}" value="${clean(a()[key])}" ${required?'required':''}>`}`;
const choices=(key,opts,multi=false)=>`<div class="choice-grid">${opts.map(s=>{let v=Array.isArray(s)?s[0]:s,t=Array.isArray(s)?s[1]:s,selected=multi?(a()[key]||[]).includes(v):a()[key]===v;return `<button type="button" class="choice-btn ${selected?'choice-btn-selected':''}" data-choice="${key}" data-value="${clean(v)}" data-multi="${multi?'yes':'no'}">${clean(t)}</button>`}).join('')}</div>`;
const nav=(prev,next,label='Continue')=>`<div class="quiz-nav">${btn('Back',prev,'secondary')}${btn(label,next)}</div>`;
const layout=(eyebrow,title,sub,body)=>`<div class="panel"><p class="eyebrow">${eyebrow}</p><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}${body}<p class="error-text hidden" id="error"></p></div>`;
const glyph=`<svg width="34" height="34" viewBox="0 0 34 34" fill="none" class="sacred-glyph"><circle cx="17" cy="17" r="12.5" stroke="currentColor" stroke-width=".9"/><line x1="17" y1="2.5" x2="17" y2="31.5" stroke="currentColor" stroke-width=".9"/></svg>`;
const showError=(msg)=>{let el=$('error');if(el){el.textContent=msg;el.classList.remove('hidden')}};
function archetype(){const t=[a().desiredIdentity,a().origin,a().disconnect,a().project,a().adaptive].join(' ').toLowerCase();let n='The Magician',q='The Visionary';if(/rebel|punk|provoc|transgress/.test(t)){n='The Devil';q='The Rebel'}else if(/dream|fantasy|surreal|mystic/.test(t)){n='The Moon';q='The Dreamer'}else if(/light|star|radiant|inspir/.test(t)){n='The Star';q='The Luminary'}else if(/renew|reinvent|reborn|transform/.test(t)){n='Death';q='The Reborn'}else if(/power|command|authority|king|queen/.test(t)){n='The Emperor';q='The Sovereign'};return {name:n,title:q,text:`Your answers suggest a creative direction associated with ${q.toLowerCase()}. Reflect on how your natural creative interests connect to the persona you describe as ${a().personaName?`“${a().personaName}”`:'your next era'}. This archetype is a creative prompt, not a fixed personality classification.`,date:new Date().toISOString(),answers:{...a()}}}
function finishReading(){if(db.reading)db.priorReading=db.reading;db.reading=archetype();save();render()}
function cardSpread(cards){
  if(!Array.isArray(cards)||cards.length!==5)return '';
  return `<div class="tarot-spread" aria-label="Your five tarot cards">${cards.map((c,i)=>{
    const card=typeof c==='string'?ARCANA.find(x=>x.n===c):c;
    if(!card)return '';
    return `<figure class="tarot-card"><img src="${clean(card.img)}" alt="${clean(card.n)} Rider-Waite-Smith card" loading="lazy"/><figcaption>${CARD_POSITIONS[i]}<span>${clean(card.n)}</span></figcaption></figure>`;
  }).join('')}</div><p class="tarot-source">Rider–Waite–Smith tarot artwork · Pamela Colman Smith · Public domain</p>`;
}
function resultCard(r){const sections=r.sections||{};
  return `<div class="reading-result-shell"><span class="starburst"></span><p class="eyebrow" style="color:#d4af37;margin:18px 0">YOUR FIVE-CARD READING</p>${cardSpread(r.cards)}<h2>${clean(r.name)}</h2><p style="color:#d4af37">${clean(r.title)}</p><p>${clean(r.text)}</p>${CARD_POSITIONS.map(k=>sections[k.toLowerCase()]?`<p style="text-align:left"><strong style="color:#d4af37">${k}</strong><br>${clean(sections[k.toLowerCase()])}</p>`:'').join('')}</div>`;
}
function showReadingLoading(){
 $('main').innerHTML=layout('THE DRAW','Your cards are being revealed.','This reading will help us both understand who you are inside and where you are going, so I can better understand how to help you.',`<div class="reading-loader" role="status" aria-live="polite"><span class="load-star" aria-hidden="true">✴</span><div class="load-cards" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div><p>Drawing your cards and interpreting their symbolism…</p></div>`);
}

function render(){let out='',v=a();
if(step==='intro'){
out=`<div class="panel hero-panel"><p class="eyebrow">THE MAGICIAN'S PATH • THE ROCKSTAR INITIATION</p><h1 class="hero-h1">You've outgrown the artist the world knows.</h1><p class="sub hero-sub">It's time to become the one you know. Tell me who you're becoming. I'll draw the cards to explore what stands in the way.</p>${field('displayName','WHAT SHOULD WE CALL YOU?','Your name')}${field('desiredIdentity','WHO IS THE ARTIST YOU ARE BECOMING?','Describe their vision, presence, artistic expression and identity…','textarea')}${field('personaName','GIVE YOUR NEW PERSONA A NAME (OPTIONAL)','A stage name, title, or identity') }<p class="option-note">Your persona name is yours to change whenever you want.</p>${btn('Begin My Application','distance')}<p class="reassurance">The reading is free. No commitment.</p></div><div class="landing-divider">${glyph}</div><div class="panel steps-panel"><h2 class="section-h2">The reading starts with you.</h2><p class="sub section-body">You don't ask the cards who you're supposed to be.<br><br>You decide that first.<br><br>The reading is a mirror — a way to explore the patterns and beliefs that might stand between your current artistic identity and the next.</p><div class="steps-list"><div class="step"><span class="step-num">01</span><div><div class="step-title">Name It</div><p class="step-desc">Describe the artist you wish to embody.</p></div></div><div class="step"><span class="step-num">02</span><div><div class="step-title">Reveal It</div><p class="step-desc">Explore your archetype through The Draw's reading.</p></div></div><div class="step"><span class="step-num">03</span><div><div class="step-title">Apply</div><p class="step-desc">Discover your recommended next step.</p></div></div></div>${btn('Begin My Application','distance')}</div>`;
}else if(step==='distance')out=layout('02 / DISTANCE','How close do you feel to them?','1 means you barely recognize this artist in yourself. 10 means you are already living as them.',`<div class="scale-grid">${Array.from({length:10},(_,i)=>`<button type="button" class="scale-btn ${Number(v.distance)===i+1?'scale-btn-selected':''}" data-choice="distance" data-value="${i+1}">${i+1}</button>`).join('')}</div>${nav('intro','resistance')}`);
else if(step==='resistance')out=layout('03 / RESISTANCE','What usually gets in the way?','',choices('obstacle',['Fear of being judged','Expectations of my audience','An outdated public persona','Perfectionism','Lack of clarity','Something else'])+nav('distance','energy'));
else if(step==='energy')out=layout('04 / ENERGY','Where does your strongest creative energy go?','Choose up to two.',choices('energy',['Making the work','Performance and visibility','Creative direction and aesthetics','Planning and perfectionism','Self-doubt and comparison','Avoidance and distraction'],true)+nav('resistance','response'));
else if(step==='response')out=layout('05 / DIRECTION','When inspiration strikes, what do you do with it?','',choices('response',['I create immediately','I plan and refine before showing anyone','I overthink and delay','I adapt it to what people expect','I share it boldly'])+nav('energy','cost'));
else if(step==='cost')out=layout('06 / TRANSFORMATION','If you became this artist, what might you have to leave behind?','',choices('cost',['The image people have of me','A comfortable but outdated aesthetic','Approval from my audience','Old creative habits','The fear of being seen differently'])+field('origin','THE FOOL — WHAT DID YOU LOVE CREATING AS A CHILD?','Your earliest memories, creative impulses, and natural interests…','textarea')+field('disconnect','WHAT NO LONGER FEELS TRUE TO YOUR ART?','Describe the disconnect with your current identity…','textarea')+nav('response','adaptive'));
else if(step==='adaptive')out=layout('07 / THE DEEPER QUESTION','What does your next era demand of you?','Think about a new project, public transformation, or artistic debut.',field('project','WHAT IS YOUR NEXT PROJECT OR ERA?','Album, performance, collection, film, artistic rebrand…','textarea')+field('adaptive','WHAT WOULD MAKE THIS TRANSFORMATION REAL?','What would you stop doing, start doing, and change in your environment?','textarea')+nav('cost','reading','Draw My Cards'));
else if(step==='reading'){if(!db.reading && db.priorReading){out=layout('YOUR PREVIOUS READING','Welcome back.','Here is the archetype from your last application. Does it still reflect who you are?',resultCard(db.priorReading)+choices('previousAccurate',[['yes','Yes, it still resonates'],['no','No, I have changed']])+nav('adaptive','accuracy','Continue'))}else{if(!db.reading){out=layout('YOUR READING','Draw your five cards.','This reading will help us both understand who you are inside and where you are going, so I can better understand how to help you.',btn('Reveal My Reading','generateReading'));}else{out=layout('YOUR READING','The artist within.','This reading will help us both understand who you are inside and where you are going, so I can better understand how to help you.',resultCard(db.reading)+nav('adaptive','accuracy','Continue'))}}}
else if(step==='accuracy')out=layout('THE REFLECTION','Does this reading feel accurate?','You decide what resonates, not the cards.',resultCard(db.reading||db.priorReading||archetype())+choices('accurate',[['yes','Yes, this reflects me'],['no','No, I want to clarify it']])+field('correction','WHAT WOULD YOU CHANGE? (IF NEEDED)','Correct or refine the interpretation in your own words…','textarea',false)+nav('reading','seriousness','Continue'));
else if(step==='seriousness')out=layout('08 / COMMITMENT','How serious are you about stepping into this identity?','Choose the answer that best describes your intent.',choices('seriousness',[['1','Just exploring'],['2','Curious but not ready'],['3','I want to begin soon'],['4','Ready to take action'],['5','Fully committed to my next era']])+nav('accuracy','income'));
else if(step==='income')out=layout('09 / YOUR CIRCUMSTANCES','What is your current income range?','Used to recommend an appropriate level of support. Your income does not determine your creative worth.',choices('income',[['under25','$0–$24,999/year'],['25to50','$25,000–$49,999/year'],['50to80','$50,000–$79,999/year'],['80to100','$80,000–$99,999/year'],['over100','$100,000+/year'],['prefer','Prefer not to say']])+nav('seriousness','experience'));
else if(step==='experience')out=layout('10 / ARTISTIC EXPERIENCE','Where are you in your artistic career?','',choices('established',[['established','I have an established body of work'],['emerging','I am building my creative practice'],['starting','I am just beginning']])+field('email','YOUR EMAIL','you@example.com','email')+field('portfolio','YOUR PORTFOLIO OR SOCIAL PROFILE (OPTIONAL)','','text',false)+`<p class="option-note">No account or email verification required.</p>`+nav('income','recommend','Submit Application'));
else if(step==='recommend'){
  const route=v.route||'self';
  const eligible=route==='call';
  const title=eligible?'Congratulations. You may be a good fit.':'Your initiation continues.';
  const copy=eligible
    ?'Your application suggests that your artistic experience, commitment, and circumstances may align with private Rockstar Initiation mentorship. Book a discovery call to discuss your next creative era and determine whether we are a good fit to work together.'
    :"Based on your application, I don't think you're the right fit for the private Rockstar Initiation just yet. I recommend beginning with the self-guided digital program and developing your next artistic identity at your own pace.";
  out=layout('APPLICATION SUBMITTED',title,copy,
    resultCard(db.reading||archetype())+
    `<div class="info-box">${eligible?'You are invited to book a complimentary discovery call to discuss your Rockstar Initiation.':'Start with the self-guided initiation. When you feel ready to take the next step, you can return and reapply.'}</div>`+
    btn(eligible?'Book Your Discovery Call':'Explore the Self-Guided Initiation','destination')+
    btn('Reapply / Revisit My Reading','reapply','secondary'));
}
$('main').innerHTML=out;document.querySelectorAll('[data-field]').forEach(el=>{el.addEventListener('input',()=>{a()[el.dataset.field]=el.value;save()})});document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{let k=el.dataset.choice,value=el.dataset.value;if(el.dataset.multi==='yes'){let arr=a()[k]||[];a()[k]=arr.includes(value)?arr.filter(x=>x!==value):arr.length<2?[...arr,value]:arr}else a()[k]=value;save();render()}));document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>move(el.dataset.action)));window.scrollTo({top:0,behavior:'instant'});
}
async function move(next){if(next==='destination'){const path=a().route;const url=path==='call'?CONFIG.discoveryCall:CONFIG.selfGuidedCheckout;if(!url){showError('This destination has not been configured yet.');return;}window.open(url,'_blank','noopener,noreferrer');return}if(next==='generateReading'){await generateArtistReading(false);return}if(next==='playAudio'){await playInitiationAudio();return}if(next==='reapply'){db.applications.push({date:new Date().toISOString(),answers:{...a()},reading:db.reading});db.priorReading=db.reading;db.reading=null;db.current={displayName:a().displayName,desiredIdentity:a().desiredIdentity,personaName:a().personaName};step='intro';feedbackCount=0;save();render();return}
if(step==='intro'&&next==='distance'&&(!a().displayName?.trim()||!a().desiredIdentity?.trim()))return showError('Enter your name and describe the artist you want to become.');
if(step==='accuracy'&&next==='seriousness'){if(!a().accurate)return showError('Tell us whether the reading feels accurate.');if(a().accurate==='no'){if(!a().correction?.trim())return showError('Tell us what you would change.');if(feedbackCount<2){feedbackCount++;a().accurate='';await generateArtistReading(true);return}}}
if(step==='reading'&&db.priorReading&&next==='accuracy'&&a().previousAccurate==='no'){await generateArtistReading(true);return}else if(step==='reading'&&db.priorReading&&next==='accuracy'&&a().previousAccurate==='yes'){db.reading=db.priorReading;save()}
if(step==='experience'&&next==='recommend'&&(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a().email||'')||!a().established||!a().seriousness||!a().income))return showError('Choose your experience, commitment, and income range, and enter a valid email.');
if(next==='recommend'){const ok=await submitArtistApplication();if(!ok)return}step=next;save();render()}
$('theme-toggle').onclick=()=>{let root=$('root');root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';$('theme-toggle').textContent=root.dataset.theme==='dark'?'☾':'☀'};
$('history-btn').onclick=()=>{let text=(db.applications.length?db.applications.map((x,i)=>`${i+1}. ${new Date(x.date).toLocaleDateString()} — ${x.reading?.name||'Reading'}`).join('\n'):'No prior applications saved in this browser.');alert(text)};
// Anonymous application: sign-in is not required or prompted.
render();
